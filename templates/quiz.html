<!DOCTYPE html>
<html>
<head>
    <title>AI Prompt Engineering Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        form { width: 80%; margin: 0 auto; }
        .question { margin-bottom: 20px; }
        .options label { display: block; margin: 5px 0; }
        input[type="submit"] { display: block; margin: 20px auto; padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>AI Prompt Engineering Quiz</h1>
    <form method="POST" action="{{ url_for('submit') }}">
        {% for q in questions %}
        <div class="question">
            <p><strong>Q{{ q.id }}. {{ q.question }}</strong></p>
            <div class="options">
                <label><input type="radio" name="q[{{ q.id }}]" value="A"> {{ q.options[0] }}</label>
                <label><input type="radio" name="q[{{ q.id }}]" value="B"> {{ q.options[1] }}</label>
                <label><input type="radio" name="q[{{ q.id }}]" value="C"> {{ q.options[2] }}</label>
                <label><input type="radio" name="q[{{ q.id }}]" value="D"> {{ q.options[3] }}</label>
            </div>
        </div>
        {% endfor %}
        <input type="submit" value="Submit Quiz">
    </form>
</body>
</html>
