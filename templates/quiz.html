<!DOCTYPE html>
<html>
<head>
    <title>AI Prompt Engineering Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        form { width: 80%; margin: 0 auto; }
        .question { margin-bottom: 20px; }
        .options label { display: block; margin: 5px 0; }
        input[type="submit"] { display: block; margin: 20px auto; padding: 10px 20px; }
        #timer { text-align: center; font-size: 20px; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AI Prompt Engineering Quiz</h1>

    <!-- Countdown Timer -->
    <div id="timer">
        Time Remaining: <span id="time">05:00</span>
    </div>

    <form method="POST" action="{{ url_for('submit') }}">
        {% for q in questions %}
        <div class="question">
            <p><strong>Q{{ q.id }}. {{ q.question }}</strong></p>
            <div class="options">
                <label><input type="radio" name="q[{{ q.id }}]" value="A"> {{ q.options[0] }}</label>
                <label><input type="radio" name="q[{{ q.id }}]" value="B"> {{ q.options[1] }}</label>
                <label><input type="radio" name="q[{{ q.id }}]" value="C"> {{ q.options[2] }}</label>
                <label><input type="radio" name="q[{{ q.id }}]" value="D"> {{ q.options[3] }}</label>
            </div>
        </div>
        {% endfor %}
        <input type="submit" value="Submit Quiz">
    </form>

    <!-- Timer Script -->
    <script>
        // Set timer duration (in seconds)
        let timeLeft = 5 * 60; // 5 minutes

        function updateTimer() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById("time").textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Time is up! Submitting your quiz...");
                document.querySelector("form").submit(); // auto-submit when time runs out
            }
            timeLeft--;
        }

        let timerInterval = setInterval(updateTimer, 1000);
        updateTimer(); // initialize immediately
    </script>
</body>
</html>
