<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Quiz Leaderboard</h1>
    <table>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Score</th>
            <th>Submitted At</th>
        </tr>
        {% for player, s, ts in leaderboard %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ player }}</td>
            <td>{{ s }} / {{ total }}</td>
            <td>{{ ts }}</td>
        </tr>
        {% endfor %}
    </table>

    <!-- AJAX auto-refresh script -->
    <script>
    function refreshLeaderboard() {
        fetch("/leaderboard_data")
            .then(response => response.json())
            .then(data => {
                const tableBody = document.querySelector("table").getElementsByTagName("tbody")[0];
                tableBody.innerHTML = ""; // clear old rows

                data.forEach((entry, index) => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${entry.player}</td>
                        <td>${entry.score} / {{ total }}</td>
                        <td>${entry.timestamp}</td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(err => console.error("Error refreshing leaderboard:", err));
    }

    // Refresh every 10 seconds
    setInterval(refreshLeaderboard, 10000);
</script>

</body>
</html>
